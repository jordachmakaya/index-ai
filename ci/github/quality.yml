# ==============================================================
# Shokunin Ship — Pipeline QUALITÉ (GitHub Actions, PR & branches)
# Destination projet: .github/workflows/quality.yml
# Stages: guard → test. Tous bloquants (D5).
# Les blocs "@ship-gateway:" sont instanciés par ship-gateway.
# ==============================================================
name: quality

on:
  pull_request:
  push:
    branches-ignore: [main]   # @ship-gateway:default-branch

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }   # @ship-gateway:pnpm-version
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: structure gate
        run: node scripts/check-shokunin-structure.mjs --strict
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: guard
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }   # @ship-gateway:pnpm-version
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: unit + integration (coverage)
        run: pnpm exec vitest run --coverage
      - name: coverage gate (from ship.config.json)
        run: |
          node --input-type=module -e "
          import { readFileSync, existsSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('.shokunin/ship/ship.config.json', 'utf8'));
          const min = cfg.gates.coverageMin;
          const path = './coverage/coverage-summary.json';
          if (!existsSync(path)) { console.error('coverage gate: summary not found'); process.exit(1); }
          const s = JSON.parse(readFileSync(path, 'utf8')).total;
          console.log('lines=' + s.lines.pct + '% (min ' + min.lines + '%)');
          if (s.lines.pct < min.lines) { console.error('COVERAGE GATE FAILED (lines)'); process.exit(1); }
          if (min.functions !== undefined && s.functions.pct < min.functions) { console.error('COVERAGE GATE FAILED (functions)'); process.exit(1); }
          console.log('coverage gate PASSED');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 5

  # @ship-gateway:e2e — job SUPPRIMÉ du fichier instancié si gates.e2e != on_mr
  e2e:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }   # @ship-gateway:pnpm-version
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
