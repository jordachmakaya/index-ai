# ==============================================================
# Shokunin Ship — Pipeline SHIP (GitHub Actions, default branch)
# Destination projet: .github/workflows/ship.yml
# Stages: detect → version → build → package → handoff
# S'arrête au SHIP_RECORD.json (frontière D4). Déploiement = adapter aval (D7).
# Secrets requis: SHIP_BOT_TOKEN (write repo). GHCR utilise GITHUB_TOKEN natif.
# ==============================================================
name: ship

on:
  push:
    branches: [main]   # @ship-gateway:default-branch

permissions:
  contents: write      # version bot push [skip ci]
  packages: write      # GHCR

concurrency:
  group: ship-main
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.SERVICES }}
      skip: ${{ steps.detect.outputs.SKIP_PIPELINE }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: detect
        env:
          SHIP_BEFORE_SHA: ${{ github.event.before }}
        run: |
          bash scripts/ship/ci-detect.sh
          cat services.env >> "$GITHUB_OUTPUT"

  version:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    concurrency:
      group: versioning
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }   # @ship-gateway:pnpm-version
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - env:
          SERVICES: ${{ needs.detect.outputs.services }}
          SHIP_BOT_TOKEN: ${{ secrets.SHIP_BOT_TOKEN }}
        run: bash scripts/ship/ci-version.sh

  build:
    runs-on: ubuntu-latest
    needs: [detect, version]
    if: needs.detect.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }   # @ship-gateway:default-branch
      - uses: pnpm/action-setup@v4
        with: { version: 10 }   # @ship-gateway:pnpm-version
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: git pull origin main   # récupère le bump du bot [skip ci]
      - env:
          SERVICES: ${{ needs.detect.outputs.services }}
        run: bash scripts/ship/ci-build.sh

  # @ship-gateway:package — job SUPPRIMÉ du fichier instancié si gates.package=false (profil S)
  package:
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: needs.detect.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }   # @ship-gateway:default-branch
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git pull origin main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io   # @ship-gateway:registry-host
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SERVICES: ${{ needs.detect.outputs.services }}
        run: bash scripts/ship/ci-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ship-digests
          path: ship-digests.env

  record:
    runs-on: ubuntu-latest
    needs: [detect, package]
    if: always() && needs.detect.outputs.skip != 'true' && needs.detect.result == 'success' && (needs.package.result == 'success' || needs.package.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }   # @ship-gateway:default-branch
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ship-digests
      - env:
          SERVICES: ${{ needs.detect.outputs.services }}
        run: bash scripts/ship/ci-record.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SHIP_RECORD
          path: SHIP_RECORD.json
          retention-days: 90
