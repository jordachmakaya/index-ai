# ==============================================================
# Shokunin Ship — Routeur Global (GitLab)
# Instancié par ship-gateway depuis blueprint-repo/ci/gitlab/.
# Contrat de stages: guard → test → build → package → handoff
# Source de vérité: .shokunin/ship/ship.config.json (PROPOSAL D6)
# ==============================================================

include:
  # 1. Pipeline QUALITÉ (branches & MR) — la police mécanique de git-discipline
  - local: '.gitlab/ci/quality.yml'
    rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

  # 2. Pipeline SHIP (default branch uniquement)
  - local: '.gitlab/ci/ship.yml'
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
