# ==============================================================
# Shokunin Ship — Pipeline QUALITÉ (GitLab, branches & MR)
# Stages: guard → test. Tous les jobs guard/test sont BLOQUANTS (décision D5).
# Les blocs "@ship-gateway:" sont instanciés par la skill ship-gateway
# depuis .shokunin/ship/ship.config.json — ne pas éditer à la main.
# ==============================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never

variables:
  PNPM_VERSION: "10"          # @ship-gateway:pnpm-version
  GIT_DEPTH: 0

stages:
  - guard
  - test

.pnpm_setup:
  image: node:22-alpine
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull
  before_script:
    - apk add --no-cache git jq bash coreutils
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - git fetch origin $CI_DEFAULT_BRANCH --depth=50 || true

# ---------------- GUARD (bloquant) ----------------
guard:
  extends: .pnpm_setup
  stage: guard
  cache:
    policy: pull-push
  script:
    - echo "guard [1/3] structure"
    - node scripts/check-shokunin-structure.mjs --strict
    - echo "guard [2/3] lint"
    - pnpm lint
    - echo "guard [3/3] typecheck"
    - pnpm exec tsc --noEmit

# ---------------- TEST (bloquant, coverage gate depuis le manifest) ----------------
test:
  extends: .pnpm_setup
  stage: test
  needs: ["guard"]
  variables:
    NODE_ENV: "test"
  script:
    - echo "test — unit + integration (coverage gate from ship.config.json)"
    - pnpm exec vitest run --coverage
    - |
      node --input-type=module -e "
      import { readFileSync, existsSync } from 'node:fs';
      const cfg = JSON.parse(readFileSync('.shokunin/ship/ship.config.json', 'utf8'));
      const min = cfg.gates.coverageMin;
      const path = './coverage/coverage-summary.json';
      if (!existsSync(path)) { console.error('coverage gate: summary not found at ' + path); process.exit(1); }
      const s = JSON.parse(readFileSync(path, 'utf8')).total;
      console.log('lines=' + s.lines.pct + '% (min ' + min.lines + '%)');
      if (s.lines.pct < min.lines) { console.error('COVERAGE GATE FAILED (lines)'); process.exit(1); }
      if (min.functions !== undefined) {
        console.log('functions=' + s.functions.pct + '% (min ' + min.functions + '%)');
        if (s.functions.pct < min.functions) { console.error('COVERAGE GATE FAILED (functions)'); process.exit(1); }
      }
      console.log('coverage gate PASSED');
      "
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 5 days

# ---------------- E2E (uniquement si gates.e2e == on_mr — profil L) ----------------
# @ship-gateway:e2e — ce job est SUPPRIMÉ du fichier instancié si gates.e2e != on_mr
e2e:
  extends: .pnpm_setup
  stage: test
  needs: ["guard"]
  image: mcr.microsoft.com/playwright:v1-noble   # @ship-gateway:playwright-image
  script:
    - pnpm exec playwright install --with-deps chromium
    - pnpm exec playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 5 days
