name: ship

# T3.1 — Pages deploy: build the VitePress site and publish it to GitHub Pages
# on every push to `main`. Free-tier runner; no secrets required. The Pages
# source must be switched to "GitHub Actions" in the repo settings (HUMAN_GATE —
# the agent never touches Pages settings).
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest # free-tier runner
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Docs build
        run: pnpm docs:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Live smoke (Pages URL)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Site responds
        run: curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' https://jordachmakaya.github.io/index-ai/

      - name: Home renders the v4 gist
        run: curl -fsS https://jordachmakaya.github.io/index-ai/ | grep -q 'verifiably readable'
